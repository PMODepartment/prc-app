<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com data:; img-src 'self' data: blob:; connect-src 'self' https://cayjeqeleenizbdzrums.supabase.co wss://cayjeqeleenizbdzrums.supabase.co; object-src 'none'; form-action 'self'">
<title>Vendor Sign In — Megawide</title>
<link rel="manifest" href="vendor-portal.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/vendor-apple-touch-icon.png">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Procurement">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script>
  /* Anti-flash: adopt the stored theme before first paint. Shares the
     wpm_theme_last key with every other page so the theme carries across.
     This page does not load ui.js (it is public), so it owns its own theme,
     exactly like login.html / forgot-password.html. */
  (function () {
    try {
      var t = localStorage.getItem('wpm_theme_last');
      var dark = t ? t === 'dark'
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark-mode');
    } catch (e) {}
  })();
</script>
<style>
  /* ⚠️ THE SAME FRAME AS login.html, on purpose. These are two front doors to
     one organisation; a vendor who has seen the staff page, or a colleague who
     lands here by mistake, should recognise it instantly. The tokens, the
     spacing, the card, the button and the mobile behaviour are lifted from
     login.html — only the title and the links differ.
     Rules are scoped to html.dark-mode (this page sets no body class). */
  html, body { overflow-x: hidden; }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  img, canvas, svg { max-width: 100% !important; }
  html,body{height:100%;font-family:'Montserrat',sans-serif;background:#fff}

  .page{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;padding:40px 20px}

  /* Brand header, above the card */
  .brand{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:26px}
  .brand-logo{width:72px;height:auto;display:block;background:transparent}
  .brand-text h1{font-size:30px;font-weight:800;color:#EE3124;line-height:1.15;margin-top:16px;letter-spacing:-.4px}
  .brand-text p{font-size:13px;color:#888;margin-top:6px}

  .form-wrap{width:100%;max-width:480px;background:#fff;border:1px solid #ececec;
    border-radius:14px;padding:30px 32px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;color:#888;margin-bottom:5px}
  .field input{width:100%;padding:11px 14px;border:1.5px solid #e8e8e8;border-radius:8px;
    font-size:14px;font-family:'Montserrat',sans-serif;color:#231F20;background:#fff;
    outline:none;transition:border-color .15s;-webkit-appearance:none}
  .field input:focus{border-color:#EE3124}
  .btn-primary{width:100%;padding:13px;background:#EE3124;color:#fff;border:none;border-radius:8px;
    font-size:14px;font-weight:700;font-family:'Montserrat',sans-serif;cursor:pointer;
    transition:background .15s;margin-top:4px;-webkit-appearance:none}
  .btn-primary:hover{background:#C42127}
  .btn-primary:disabled{background:#e8a09b;cursor:default}
  .msg{font-size:13px;padding:10px 14px;border-radius:8px;margin-bottom:14px;line-height:1.5;
    display:none;border:1px solid #FFD0D0;background:#FEE2E2;color:#991B1B}
  .msg.error,.msg.show{display:block}
  .msg.info{display:block;border-color:#F5B8B3;background:#FDECEA;color:#9B1B1B}
  .form-links{display:flex;flex-direction:column;align-items:center;gap:9px;margin-top:18px;
    font-size:13px;color:#999;text-align:center}
  .form-links a{color:#EE3124;text-decoration:none;font-weight:600}
  .form-links a:hover{text-decoration:underline}

  .login-theme-toggle{position:fixed;top:16px;right:16px;z-index:60;width:40px;height:40px;border-radius:50%;border:1px solid #e5e5e5;background:#fff;color:#231F20;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.1);transition:background .18s,color .18s,border-color .18s}
  .login-theme-toggle:hover{background:#f5f5f5}

  /* Dark mode */
  html.dark-mode body{background:#1C1C1C;color:#F0EFEF}
  html.dark-mode{color-scheme:dark}
  html.dark-mode .form-wrap{background:#2B2C2B;border-color:rgba(255,255,255,.12);
    box-shadow:0 10px 30px rgba(0,0,0,.35)}
  html.dark-mode .field label{color:#9B9999}
  html.dark-mode .field input{background:#333433;border-color:rgba(255,255,255,.12);color:#F0EFEF}
  html.dark-mode .field input:focus{border-color:#EE3124}
  .field input::placeholder{color:#bbb}
  html.dark-mode .field input::placeholder{color:#6E6C6C}
  html.dark-mode .brand-text p{color:#9B9999}
  html.dark-mode .form-links{color:#9B9999}
  html.dark-mode .msg{background:#3D1A19;border-color:#5A2E2A;color:#FFB4AC}
  html.dark-mode .msg.info{background:#33211F;border-color:#5A2E2A;color:#FF9C92}
  html.dark-mode .login-theme-toggle{background:#2B2C2B;color:#DCDBDB;border-color:rgba(255,255,255,.16)}
  html.dark-mode .login-theme-toggle:hover{background:#333433}

  /* ⚠️ Mobile drops the card chrome entirely, exactly as login.html does — a
     boxed card inside a 375px viewport just wastes horizontal space. */
  @media (max-width:640px){
    .page{justify-content:flex-start;padding:44px 16px}
    .form-wrap{background:none;border:none;box-shadow:none;padding:0;max-width:none}
    html.dark-mode .form-wrap{background:none;box-shadow:none}
    .field input{font-size:16px}   /* 16px stops iOS zooming on focus */
    .btn-primary{min-height:50px}
  }
</style>
</head>
<body>

<button class="login-theme-toggle" id="loginThemeToggle" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Switch theme"></button>
<div class="page">

  <!-- Brand header — same shape as login.html: mark, red app title, grey org line. -->
  <div class="brand">
    <img class="brand-logo" src="assets/img/megawide-mark.png" alt="Megawide Construction">
    <div class="brand-text">
      <h1>Vendor Portal</h1>
      <p>Megawide Construction Corporation</p>
    </div>
  </div>

  <div class="form-wrap">
    <div class="msg" id="msg"></div>
    <form id="form" onsubmit="signIn(event)">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" placeholder="you@yourcompany.com" required>
      </div>
      <div class="field">
        <label for="pw">Password</label>
        <input type="password" id="pw" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button class="btn-primary" id="btn" type="submit">Sign In</button>
    </form>
    <div class="form-links">
      <a href="forgot-password.html">Forgot password?</a>
      <span>Not registered yet? <a href="vendor-register.html">Register your company</a></span>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SB_URL = 'https://cayjeqeleenizbdzrums.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNheWplcWVsZWVuaXpiZHpydW1zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3OTE5NzUsImV4cCI6MjA5NTM2Nzk3NX0.xWF6mSMTYSL65S56FTUSWFN0udJSY_yzUedU2CwFwpw';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

/* Lifted verbatim from login.html so the two front doors behave identically,
   including the icon. Shares the wpm_theme_last key, so a theme chosen on
   either door carries into the app. */
var _SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/></svg>';
var _MOON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function _vlApply(dark, persist){
  document.documentElement.classList.toggle('dark-mode', dark);
  document.body.classList.toggle('dark-mode', dark);
  var b=document.getElementById('loginThemeToggle');
  if(b){ b.innerHTML = dark?_SUN:_MOON; b.title = dark?'Switch to light mode':'Switch to dark mode'; }
  if(persist){ try{ localStorage.setItem('wpm_theme_last', dark?'dark':'light'); }catch(e){} }
}
function toggleTheme(){ _vlApply(!document.documentElement.classList.contains('dark-mode'), true); }
_vlApply(document.documentElement.classList.contains('dark-mode'), false);
function msg(text, kind) {
  const b = document.getElementById('msg');
  b.className = 'msg ' + (kind || 'error');
  b.innerHTML = text;
  // ⚠️ CLEARS THE INLINE display:none set by signIn(). Without this the box
  //    stays hidden forever: an inline style outranks `.msg.error{display:block}`
  //    however specific the class rule is, so every failed sign-in was silent.
  b.style.display = '';
}

/* Where a signed-in account belongs. This page is the VENDOR door, so it only
   ever lets a vendor through — a Megawide login is sent to its own door rather
   than into a portal that would just tell it that it is on the wrong account.
   A claimant whose registration is still pending has no users row at all (by
   design: they must not land in the staff approval queue), so they go back to
   vendor-register.html, which shows their claim's status. */
async function route(session) {
  const { data: prof } = await sb.from('users').select('role, status').eq('id', session.user.id).maybeSingle();
  if (!prof) { window.location.href = 'vendor-register.html'; return; }
  if (prof.role === 'vendor') {
    if (prof.status !== 'approved') { window.location.href = 'vendor-register.html'; return; }
    window.location.href = 'vendor-portal.html';
    return;
  }
  // A Megawide account. Do not sign it out — it is a valid session; send it to
  // its own entrance silently. Deliberately says nothing: this door is the
  // vendors' and should not name the internal app to anyone standing at it.
  window.location.href = 'login.html';
}

async function signIn(e) {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const email = document.getElementById('email').value.trim();
  const pw = document.getElementById('pw').value;
  document.getElementById('msg').style.display = 'none';
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email: email, password: pw });
    if (error) throw error;
    await route(data.session);
  } catch (err) {
    msg(/invalid login/i.test(err.message || '')
      ? 'That email and password do not match. Check them and try again.'
      : (err.message || 'Could not sign in.'));
    btn.disabled = false; btn.textContent = 'Sign In';
  }
}

// Already signed in? Route straight through rather than asking again.
(async function () {
  try {
    const { data } = await sb.auth.getSession();
    if (data && data.session) await route(data.session);
  } catch (e) {}
})();
</script>
</body>
</html>
