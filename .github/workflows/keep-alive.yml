name: Supabase keep-alive

# Prevents the Supabase free tier from pausing (it sleeps after ~7 days of no
# activity, then cold-starts 5–30 s on the next request — and a long-paused
# project can eventually be deleted). This runs a tiny DB query every 3 days to
# keep it warm. Complements (doesn't replace) an external pinger like UptimeRobot.
#
# SETUP (one time): add two repo secrets under
#   Settings → Secrets and variables → Actions → New repository secret
#   • SUPABASE_URL       = https://cayjeqeleenizbdzrums.supabase.co
#   • SUPABASE_ANON_KEY  = <the anon/public key from Supabase → Project Settings → API>
# (The anon key is already public in the client, so this is not a new exposure —
# using a secret just keeps the workflow tidy.)

on:
  schedule:
    - cron: '17 6 */3 * *'   # 06:17 UTC every 3rd day (well under the 7-day pause window)
  workflow_dispatch: {}        # allow manual "Run workflow" from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (touch the DB)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing secrets. Add SUPABASE_URL and SUPABASE_ANON_KEY (see this file's header)."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/projects?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase responded HTTP $code"
          # Any HTTP response (2xx or even a 4xx from RLS) means Postgres was reached,
          # which resets the inactivity timer. Only a total network failure is a problem.
          if [ "$code" = "000" ]; then
            echo "::error::No response from Supabase (network failure) — DB not reached."
            exit 1
          fi
