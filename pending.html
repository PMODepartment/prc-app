<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: blob:; connect-src 'self' https://cayjeqeleenizbdzrums.supabase.co wss://cayjeqeleenizbdzrums.supabase.co; object-src 'none'; base-uri 'self'"/>
  <link rel="icon" type="image/png" href="assets/img/favicon.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pending Approval — Megawide EPC Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { overflow-x: hidden; }
    * { box-sizing: border-box; max-width: 100%; }
    img, canvas, svg { max-width: 100% !important; }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;font-family:'Montserrat',sans-serif;background:#F4F4F4;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{background:#fff;border-radius:16px;box-shadow:0 4px 32px rgba(0,0,0,.08);padding:48px 40px;max-width:480px;width:100%;text-align:center}
    .logo-wrap{margin-bottom:32px;display:flex;justify-content:center}
    .logo-wrap img{height:40px;width:auto;object-fit:contain}
    .icon-wrap{width:72px;height:72px;border-radius:50%;background:#FEF3C7;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:32px}
    h1{font-size:20px;font-weight:700;color:#231F20;margin-bottom:10px}
    .desc{font-size:14px;color:#888;line-height:1.7;margin-bottom:32px}
    .desc strong{color:#231F20}
    .btn-outline{display:inline-flex;align-items:center;gap:8px;padding:11px 24px;border:1.5px solid #EE3124;border-radius:8px;color:#EE3124;font-size:14px;font-weight:600;font-family:'Montserrat',sans-serif;text-decoration:none;cursor:pointer;background:none;transition:all .15s;margin-bottom:10px;width:100%;justify-content:center}
    .btn-outline:hover{background:#EE3124;color:#fff}
    .btn-ghost{display:inline-flex;align-items:center;gap:8px;padding:11px 24px;border:1.5px solid #e8e8e8;border-radius:8px;color:#888;font-size:14px;font-family:'Montserrat',sans-serif;text-decoration:none;cursor:pointer;background:none;transition:all .15s;width:100%;justify-content:center}
    .btn-ghost:hover{border-color:#bbb;color:#555}
    .divider{border:none;border-top:1px solid #f0f0f0;margin:8px 0}
    /* ── Theme toggle ── */
    .login-theme-toggle{position:fixed;top:16px;right:16px;z-index:60;width:40px;height:40px;border-radius:50%;border:1px solid #e5e5e5;background:#fff;color:#231F20;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.1);transition:background .18s,color .18s,border-color .18s}
    .login-theme-toggle:hover{background:#f5f5f5}
    /* ── Dark mode (html.dark-mode set by anti-flash before render) ── */
    html.dark-mode,html.dark-mode body{background:#1C1C1C}
    html.dark-mode .card{background:#2B2C2B;box-shadow:0 4px 32px rgba(0,0,0,.45)}
    html.dark-mode h1{color:#F0EFEF}
    html.dark-mode .desc{color:#9B9999}
    html.dark-mode .desc strong{color:#F0EFEF}
    html.dark-mode .icon-wrap{background:#2C2108}
    html.dark-mode .btn-ghost{border-color:rgba(255,255,255,.16);color:#9B9999}
    html.dark-mode .btn-ghost:hover{border-color:#777;color:#DCDBDB}
    html.dark-mode .divider{border-top-color:rgba(255,255,255,.09)}
    html.dark-mode .login-theme-toggle{background:#2B2C2B;color:#DCDBDB;border-color:rgba(255,255,255,.16)}
    html.dark-mode .login-theme-toggle:hover{background:#333433}
  </style>
  <script>
    (function(){ try { var t=localStorage.getItem('wpm_theme_last'); var dark=t==='dark'||(t===null&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches); if(dark)document.documentElement.classList.add('dark-mode'); } catch(e){} })();
  </script>
  <!-- PWA / Add-to-Home-Screen app icon -->
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"/>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Procurement"/>
  <meta name="mobile-web-app-capable" content="yes"/>
</head>
<body>
  <button class="login-theme-toggle" id="loginThemeToggle" onclick="toggleLoginTheme()" aria-label="Toggle dark mode" title="Switch to dark mode"></button>
  <div class="card">
    <div class="logo-wrap">
      <img src="assets/img/megawide-logo.png" alt="Megawide Construction">
    </div>
    <div class="icon-wrap">⏱</div>
    <h1>Awaiting Approval</h1>
    <p class="desc">
      Your registration has been submitted successfully.<br><br>
      The administrator will review your request and assign your project access.
      Please check back later or contact your <strong>procurement manager</strong>.
    </p>
    <a href="login.html" class="btn-outline">← Back to Sign In</a>
    <div class="divider"></div>
    <button class="btn-ghost" onclick="signOut()">Sign out</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const sb = window.supabase.createClient(
      'https://cayjeqeleenizbdzrums.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNheWplcWVsZWVuaXpiZHpydW1zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3OTE5NzUsImV4cCI6MjA5NTM2Nzk3NX0.xWF6mSMTYSL65S56FTUSWFN0udJSY_yzUedU2CwFwpw'
    );

    /* ── Theme toggle (per-device, shares wpm_theme_last with the dashboard) ── */
    var _SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/></svg>';
    var _MOON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
    function _loginApply(dark, persist){
      document.documentElement.classList.toggle('dark-mode', dark);
      document.body.classList.toggle('dark-mode', dark);
      var b=document.getElementById('loginThemeToggle');
      if(b){ b.innerHTML = dark?_SUN:_MOON; b.title = dark?'Switch to light mode':'Switch to dark mode'; }
      if(persist){ try{ localStorage.setItem('wpm_theme_last', dark?'dark':'light'); }catch(e){} }
    }
    window.toggleLoginTheme=function(){ _loginApply(!document.documentElement.classList.contains('dark-mode'), true); };
    _loginApply(document.documentElement.classList.contains('dark-mode'), false);

    window.signOut = async () => { await sb.auth.signOut(); window.location.href = 'login.html'; };
  </script>
</body>
</html>
