<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: blob:; connect-src 'self' https://cayjeqeleenizbdzrums.supabase.co wss://cayjeqeleenizbdzrums.supabase.co https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'"/>
  <link rel="icon" type="image/png" href="assets/img/favicon.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Set New Password — Megawide EPC Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { overflow-x: hidden; }
    * { box-sizing: border-box; max-width: 100%; }
    img, canvas, svg { max-width: 100% !important; }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;font-family:'Montserrat',sans-serif;background:#F4F4F4;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{background:#fff;border-radius:16px;box-shadow:0 4px 32px rgba(0,0,0,.08);padding:48px 40px;max-width:420px;width:100%}
    .logo-wrap{margin-bottom:28px;text-align:center}
    .logo-wrap img{height:52px;width:auto;object-fit:contain;display:inline-block}
    h1{font-size:20px;font-weight:700;color:#231F20;margin-bottom:6px}
    .sub{font-size:13px;color:#888;margin-bottom:24px;line-height:1.6}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#888;margin-bottom:6px}
    .field input{width:100%;padding:11px 14px;border:1.5px solid #e8e8e8;border-radius:8px;font-size:14px;font-family:'Montserrat',sans-serif;color:#231F20;outline:none;transition:border-color .15s}
    .field input:focus{border-color:#EE3124}
    .btn{width:100%;padding:13px;background:#EE3124;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;font-family:'Montserrat',sans-serif;cursor:pointer;margin-top:16px;transition:background .15s}
    .btn:hover{background:#C42127}
    .btn:disabled{background:#e8a09b;cursor:default}
    .msg{font-size:13px;padding:10px 14px;border-radius:8px;margin-bottom:14px;display:none;line-height:1.5}
    .msg.error{background:#FEE2E2;color:#991B1B;display:block}
    .msg.success{background:#D1FAE5;color:#065F46;display:block}
    .msg.info{background:#EEF2FF;color:#3730A3;display:block}
    .back{text-align:center;margin-top:16px;font-size:13px;color:#888}
    .back a{color:#EE3124;text-decoration:none;font-weight:600}
    .hint{font-size:11px;color:#aaa;margin-top:4px}
    .hidden{display:none !important}
    /* ── Theme toggle ── */
    .login-theme-toggle{position:fixed;top:16px;right:16px;z-index:60;width:40px;height:40px;border-radius:50%;border:1px solid #e5e5e5;background:#fff;color:#231F20;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.1);transition:background .18s,color .18s,border-color .18s}
    .login-theme-toggle:hover{background:#f5f5f5}
    /* ── Dark mode ── */
    html.dark-mode,html.dark-mode body{background:#1C1C1C}
    html.dark-mode .card{background:#2B2C2B;box-shadow:0 4px 32px rgba(0,0,0,.45)}
    html.dark-mode .logo-wrap img{filter:none !important}
    html.dark-mode h1{color:#F0EFEF}
    html.dark-mode .sub{color:#9B9999}
    html.dark-mode .field label{color:#9B9999}
    html.dark-mode .field input{background:#333433;color:#F0EFEF;border-color:rgba(255,255,255,.16)}
    html.dark-mode .field input::placeholder{color:#777}
    html.dark-mode .hint{color:#777}
    html.dark-mode .back{color:#9B9999}
    html.dark-mode .msg.error{background:#3D1A19;color:#FCA5A5}
    html.dark-mode .msg.success{background:#102B1F;color:#6EE7B7}
    html.dark-mode .msg.info{background:#1E223D;color:#A5B4FC}
    html.dark-mode .login-theme-toggle{background:#2B2C2B;color:#DCDBDB;border-color:rgba(255,255,255,.16)}
    html.dark-mode .login-theme-toggle:hover{background:#333433}
  </style>
  <script>
    (function(){ try { var t=localStorage.getItem('wpm_theme_last'); var dark=t==='dark'||(t===null&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches); if(dark)document.documentElement.classList.add('dark-mode'); } catch(e){} })();
  </script>
  <!-- PWA / Add-to-Home-Screen app icon -->
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"/>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Procurement"/>
  <meta name="mobile-web-app-capable" content="yes"/>
</head>
<body>
  <button class="login-theme-toggle" id="loginThemeToggle" onclick="toggleLoginTheme()" aria-label="Toggle dark mode" title="Switch to dark mode"></button>
  <div class="card">
    <div class="logo-wrap">
      <img src="assets/img/megawide-mark-red.png" alt="Megawide">
    </div>
    <h1>Set a New Password</h1>
    <p class="sub" id="sub">Verifying your reset link…</p>
    <div class="msg" id="msg"></div>

    <!-- Reset form (revealed once the recovery session is confirmed) -->
    <div id="form" class="hidden">
      <div class="field">
        <label for="pw1">New Password</label>
        <input type="password" id="pw1" placeholder="At least 8 characters" autocomplete="new-password">
        <div class="hint">Use at least 8 characters.</div>
      </div>
      <div class="field">
        <label for="pw2">Confirm New Password</label>
        <input type="password" id="pw2" placeholder="Re-enter your new password" autocomplete="new-password">
      </div>
      <button class="btn" id="btn">Update Password</button>
    </div>

    <div class="back"><a href="login.html">← Back to Sign In</a></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://cayjeqeleenizbdzrums.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNheWplcWVsZWVuaXpiZHpydW1zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3OTE5NzUsImV4cCI6MjA5NTM2Nzk3NX0.xWF6mSMTYSL65S56FTUSWFN0udJSY_yzUedU2CwFwpw';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const $ = id => document.getElementById(id);
    const msg = $('msg'), sub = $('sub'), formEl = $('form'), btn = $('btn');

    /* ── Theme toggle (shares wpm_theme_last with the dashboard) ── */
    var _SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/></svg>';
    var _MOON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
    function _loginApply(dark, persist){
      document.documentElement.classList.toggle('dark-mode', dark);
      document.body.classList.toggle('dark-mode', dark);
      var b=$('loginThemeToggle');
      if(b){ b.innerHTML = dark?_SUN:_MOON; b.title = dark?'Switch to light mode':'Switch to dark mode'; }
      if(persist){ try{ localStorage.setItem('wpm_theme_last', dark?'dark':'light'); }catch(e){} }
    }
    window.toggleLoginTheme=function(){ _loginApply(!document.documentElement.classList.contains('dark-mode'), true); };
    _loginApply(document.documentElement.classList.contains('dark-mode'), false);

    function showMsg(text, cls){ msg.textContent = text; msg.className = 'msg ' + cls; }
    function clearMsg(){ msg.textContent = ''; msg.className = 'msg'; }

    let recoveryReady = false;
    function revealForm(){
      if (recoveryReady) return;
      recoveryReady = true;
      sub.textContent = 'Enter and confirm your new password below.';
      formEl.classList.remove('hidden');
      clearMsg();
      $('pw1').focus();
    }
    function showLinkError(text){
      sub.textContent = 'We couldn’t verify this reset link.';
      showMsg(text, 'error');
      formEl.classList.add('hidden');
    }

    // A recovery redirect sets the session automatically (detectSessionInUrl).
    // Reveal the form the moment that happens.
    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' || (session && !recoveryReady)) revealForm();
    });

    (async () => {
      // Surface an explicit error passed back in the URL (expired/invalid link).
      const hash = window.location.hash || '';
      const qs = window.location.search || '';
      const errMatch = (hash + '&' + qs).match(/error_description=([^&]+)/);
      if (errMatch) {
        showLinkError(decodeURIComponent(errMatch[1].replace(/\+/g, ' ')));
        return;
      }
      // Give detectSessionInUrl a moment to parse the token, then confirm.
      const settle = async () => {
        const { data } = await sb.auth.getSession();
        return !!(data && data.session);
      };
      if (await settle()) { revealForm(); return; }
      setTimeout(async () => {
        if (recoveryReady) return;
        if (await settle()) revealForm();
        else showLinkError('This password reset link is invalid or has expired. Please request a new one from the “Forgot password” page.');
      }, 1800);
    })();

    async function submit(){
      const p1 = $('pw1').value, p2 = $('pw2').value;
      clearMsg();
      if (p1.length < 8) { showMsg('Password must be at least 8 characters.', 'error'); $('pw1').focus(); return; }
      if (p1 !== p2)     { showMsg('The two passwords don’t match. Re-enter them.', 'error'); $('pw2').focus(); return; }
      btn.textContent = 'Updating…'; btn.disabled = true;
      const { error } = await sb.auth.updateUser({ password: p1 });
      if (error) {
        showMsg(error.message, 'error');
        btn.textContent = 'Update Password'; btn.disabled = false;
        return;
      }
      formEl.classList.add('hidden');
      sub.textContent = 'All set.';
      showMsg('Your password has been updated. Redirecting to sign in…', 'success');
      try { await sb.auth.signOut(); } catch(e){}
      setTimeout(() => { window.location.href = 'login.html'; }, 1800);
    }

    btn.addEventListener('click', submit);
    $('pw2').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  </script>
</body>
</html>
